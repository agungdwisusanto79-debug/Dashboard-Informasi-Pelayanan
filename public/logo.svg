<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filter for crisp text stroke and depth -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <!-- Path for the top circular text -->
    <!-- Arc from around 170 deg clockwise to 10 deg -->
    <path id="topArcPath" d="M 230,175 A 130,130 0 1,1 425,310" fill="none" />
    
    <!-- Path for the bottom circular text -->
    <path id="bottomArcPath" d="M 415,310 A 130,130 0 0,1 230,365" fill="none" />

    <!-- Full circular text path for smooth wrapping -->
    <path id="circleTextPath" d="M 245,175 A 125,125 0 1,1 430,305 A 125,125 0 0,1 245,370" fill="none" />
    
    <!-- Circular ribbon gradient -->
    <linearGradient id="blueRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f3b7d" />
    </linearGradient>
  </defs>

  <!-- Background (Transparent or dark-ready) -->
  <rect width="500" height="500" rx="40" fill="transparent" />

  <!-- Outer Circular Arc Ring Graphic -->
  <!-- Outer Blue Arc (Open C-shape facing left) -->
  <path 
    d="M 255 188 A 120 120 0 1 1 420 280 A 120 120 0 0 1 250 348" 
    fill="none" 
    stroke="#0284c7" 
    stroke-width="18" 
    stroke-linecap="round"
  />
  <path 
    d="M 255 188 A 120 120 0 1 1 420 280 A 120 120 0 0 1 250 348" 
    fill="none" 
    stroke="#0f3b7d" 
    stroke-width="10" 
    stroke-linecap="round"
  />
  <path 
    d="M 258 188 A 120 120 0 1 1 418 280 A 120 120 0 0 1 252 348" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="1.8" 
    stroke-dasharray="4,4"
  />

  <!-- Circular Arc Text: SUKU DINAS KEPENDUDUKAN DAN PENCATATAN SIPIL KOTA ADM JAKARTA SELATAN -->
  <text fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="900" letter-spacing="1.2">
    <textPath href="#topArcPath" startOffset="3%" text-anchor="start">
      SUKU DINAS KEPENDUDUKAN DAN PENCATATAN SIPIL
    </textPath>
  </text>
  
  <text fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1.5">
    <textPath href="#bottomArcPath" startOffset="10%" text-anchor="start">
      KOTA ADM JAKARTA SELATAN
    </textPath>
  </text>

  <!-- ========================================================================= -->
  <!-- MAIN TYPOGRAPHY LOGO: "sudinduk" & "capil"                                -->
  <!-- ========================================================================= -->
  <g id="main-logo-text" filter="url(#shadow)">
    
    <!-- 1. "sudin" (Warm Yellow/Orange with thick white stroke) -->
    <!-- White outer stroke base -->
    <text 
      x="35" 
      y="255" 
      font-family="'Montserrat', 'Arial Black', Impact, system-ui, sans-serif" 
      font-size="88" 
      font-weight="900" 
      letter-spacing="-2px"
      fill="#ffffff" 
      stroke="#ffffff" 
      stroke-width="16" 
      stroke-linejoin="round" 
      stroke-linecap="round"
    >
      sudin
    </text>
    <!-- Yellow fill -->
    <text 
      x="35" 
      y="255" 
      font-family="'Montserrat', 'Arial Black', Impact, system-ui, sans-serif" 
      font-size="88" 
      font-weight="900" 
      letter-spacing="-2px"
      fill="#f59e0b"
    >
      sudin
    </text>

    <!-- 2. "duk" (Vibrant Emerald Green with thick white stroke) -->
    <!-- White outer stroke base -->
    <text 
      x="272" 
      y="255" 
      font-family="'Montserrat', 'Arial Black', Impact, system-ui, sans-serif" 
      font-size="88" 
      font-weight="900" 
      letter-spacing="-2px"
      fill="#ffffff" 
      stroke="#ffffff" 
      stroke-width="16" 
      stroke-linejoin="round" 
      stroke-linecap="round"
    >
      duk
    </text>
    <!-- Green fill -->
    <text 
      x="272" 
      y="255" 
      font-family="'Montserrat', 'Arial Black', Impact, system-ui, sans-serif" 
      font-size="88" 
      font-weight="900" 
      letter-spacing="-2px"
      fill="#16a34a"
    >
      duk
    </text>

    <!-- 3. "capil" (Deep Navy/Blue with thick white stroke) -->
    <!-- Positioned below "duk" and overlapping slightly -->
    <!-- White outer stroke base -->
    <text 
      x="190" 
      y="330" 
      font-family="'Montserrat', 'Arial Black', Impact, system-ui, sans-serif" 
      font-size="94" 
      font-weight="900" 
      letter-spacing="-3px"
      fill="#ffffff" 
      stroke="#ffffff" 
      stroke-width="18" 
      stroke-linejoin="round" 
      stroke-linecap="round"
    >
      capil
    </text>
    <!-- Blue fill -->
    <text 
      x="190" 
      y="330" 
      font-family="'Montserrat', 'Arial Black', Impact, system-ui, sans-serif" 
      font-size="94" 
      font-weight="900" 
      letter-spacing="-3px"
      fill="#154984"
    >
      capil
    </text>
  </g>
</svg>
